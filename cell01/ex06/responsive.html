<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table 1x2</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .my-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .First-cell {
            background-color: rgb(137, 199, 113);
            text-align: center;
            border: 1px solid #333;
        }

        .Second-cell {
            background-color: rgb(206, 127, 166);
            text-align: center;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <table class="my-table">
        <tr>
            <td class="First-cell">First cell</td>
            <td class="Second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
